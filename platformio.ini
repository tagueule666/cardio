; PlatformIO Project Configuration File - projet CARDIO ECE
;
; Structure :
;   include/     fichiers .h (config.h = brochage et réglages)
;   src/         fichiers .cpp, main.cpp = programme principal
;   src/tests/   programmes de test de chaque module (choisis par MODE_TEST)
;
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
; Bibliothèque des écrans OLED, téléchargée automatiquement à la 1re compilation.
lib_deps = olikraus/U8g2
; Vitesse du moniteur série (Serial.begin(115200) dans les tests).
monitor_speed = 115200
